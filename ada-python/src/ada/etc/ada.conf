# ADA default configuration
#
# This file is loaded as the bundled default.
# User config (~/.ada/ada.conf) overrides these values.
# Environment variables override config file values.
#
# API endpoint for dCache (must end with /api/v1 or /api/v2)
api=https://dcacheview.grid.surfsara.nl:22880/api/v1

# Use IGTF Grid certificates (true/false)
igtf=true

# SSE channel timeout in seconds
channel_timeout=3600
