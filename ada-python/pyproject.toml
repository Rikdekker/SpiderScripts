[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ada-dcache"
version = "0.1.0"
description = "ADA - Advanced dCache API tool to manage your data in dCache"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "SURF", email = "helpdesk@surfsara.nl" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ada = "ada.cli.app:main"

[project.urls]
Homepage = "https://github.com/sara-nl/SpiderScripts"
Documentation = "https://doc.spider.surfsara.nl/en/latest/Pages/storage/ada-interface.html"
Repository = "https://github.com/sara-nl/SpiderScripts"
Issues = "https://github.com/sara-nl/SpiderScripts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ada"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ada"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require a live dCache instance",
]
